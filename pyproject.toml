[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safetybox"
version = "0.0.0"
description = "Research foundation for an external deterministic runtime safety system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SafetyBox contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safetybox"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# EXP-015-FROZEN-CORPUS-RUFF-DISPOSITION@1: byte-immutable, checksum-covered
# research artifacts. See docs/engineering/EXP-015_FROZEN_CORPUS_RUFF_DISPOSITION.md.
[tool.ruff.lint.per-file-ignores]
"experiments/EXP-015/corpus/build_corpus.py" = ["B007", "E401", "E501", "E701", "E702", "I001"]
"experiments/EXP-015/corpus/integrity_check.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
