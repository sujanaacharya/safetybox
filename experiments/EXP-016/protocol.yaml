argv:
  child_protocol: E16A_magic_u32be_count_then_u32be_length_and_bytes
  comparison: UTF8_BYTE_EXACT_ORDERED
  shell: false
  registered_literal_classes:
    - semicolon_rm_text
    - dollar_parentheses
    - backticks
    - ampersand_ampersand
    - double_pipe
    - pipe
    - greater_than
    - less_than
    - empty_element
    - Unicode

environment:
  exact_child:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  registered_absent_parent_sentinels:
    - HOME
    - PATH
    - EXP016_PARENT_SECRET
  runtime_data_role: parent_perturbation_only
  expected_label_location: scoring_metadata_only

output:
  retained_limit_per_stream: 65536
  registered_regions:
    - empty
    - just_below_65536
    - exactly_65536
    - just_above_65536
    - comfortably_above_but_at_most_131072
  exact_checks:
    - retained_bytes
    - total_byte_count
    - retained_byte_count
    - complete_stream_sha256
    - truncation_flag

terminal_cases:
  nonzero_exit_codes: [1, 7, 23]
  signal: safe_POSIX_self_signal
  timeout:
    scheduling_margin_required: true
    term_completion: true
    kill_escalation_for_ignore_TERM: true
    bounded_runtime: true

audit:
