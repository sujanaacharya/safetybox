  lesson: MATERIALIZABILITY_IS_NOT_ENOUGH

research_question: >-
  Given an already-authorized process request with independently verified
  native-executable fixtures, does SafetyBox correctly mediate real direct-child
  process execution semantics?

research_questions:
  RQ-016-01: >-
    Can an authorized, independently verified native executable pass validation
    and produce a real direct child?
  RQ-016-02: >-
    Does the adapter preserve argv literally without shell reinterpretation?
  RQ-016-03: Does the child receive only the frozen minimal environment?
  RQ-016-04: >-
    Are stdout/stderr capture, counts, hashes, and truncation truthful?
  RQ-016-05: >-
    Are nonzero exit, timeout, signal, and supported injected-failure semantics
    classified truthfully?
  RQ-016-06: Does audit ordering occur correctly around real child spawn?
  RQ-016-07: >-
    Are adapter-mediated direct-child semantics deterministic under preregistered
    repeat cases?
  RQ-016-08: >-
    Can the PMED-L1 routing boundary be demonstrated with explicit
    DIRECT_CONTROL controls?

hypotheses:
  H-016-01:
    statement: >-
      Every registered authorized intended-success case whose executable is
      independently VALID_NATIVE_EXECUTABLE reaches real child creation.
    measure: child_created among AUTHORIZED_EXPECTED_TO_EXECUTE
  H-016-02:
    statement: Requested argv equals length-framed child-observed argv byte-exactly.
    measure: byte_exact_argv_matches / registered argv cases
  H-016-03:
    statement: Shell-looking argv remains literal and creates no shell-selected effects.
    measure: literal_child_matches_and_absent_shell_effects / no-shell cases
  H-016-04:
    statement: >-
      Child environment equals LANG=C.UTF-8 and LC_ALL=C.UTF-8, with PATH, HOME,
      and EXP016_PARENT_SECRET absent.
    measure: exact_environment_matches / environment cases
  H-016-05:
    statement: >-
      Captured retained bytes, full byte counts, SHA-256 values, and truncation
      flags equal independent expectations.
    measure: truthful_stream_observations / output cases
  H-016-06:
    statement: >-
      Registered nonzero exit, signal, TERM timeout, KILL escalation, and supported
      injected failures receive their preregistered terminal classes.
    measure: truthful_terminal_classifications / terminal-and-failure cases
  H-016-07:
    statement: Every registered policy-denied request invokes no protected spawn primitive.
    measure: denied_cases_with_zero_primitive_invocations / denied cases
  H-016-08:
    statement: >-
      DIRECT_CONTROL creates the safe native child without ProcessAdapter,
      demonstrating the PMED-L1 routing limitation.
    measure: truthful_direct_controls / DIRECT_CONTROL cases

scope:
  target: PMED-L1 adapter-routed direct native child
  platform: Linux x86_64 development freeze; future corpus must match its frozen host gate
  execution: sequential normal-user isolated temporary roots
  primary_targets:
    - successful native child execution
    - physical executable and cwd validation
    - argv fidelity and shell-false literal semantics
    - exact minimal child environment
    - stdout and stderr capture metadata
    - nonzero exit timeout signal and supported injected failures
    - audit ordering and audit truthfulness
    - deterministic semantic repeats
    - DIRECT_CONTROL PMED-L1 route boundary
    - benign completion
  explicit_exclusions:
    - arbitrary process confinement
    - descendant confinement or observation
    - network confinement or observation
    - child filesystem mediation beyond selected marker observation
    - validation-to-exec TOCTOU safety
    - authenticated identity session or actor binding
    - shell command safety beyond literal shell-false argv delivery
    - production readiness
    - concurrency
    - privilege transitions
    - unbounded output or resource exhaustion

rtm:
  current: RTM-1
  automatic_promotion: false
  required_before_future_advancement_consideration:
    - positive substantial adapter-routed child denominator
    - real native children created and correctly completed
    - all frozen execution-semantic gates pass
  governance: separate post-result maturity decision required

authorization:
  role: CONTROLLED_PRECONDITION_NOT_PRIMARY_BENCHMARK
  expected_shape: approximately_80_percent_authorization_positive
  intended_success: known compound ALLOW under independently verified TaskContract
  deny_controls: bounded reconfirmation set with zero protected spawn invocations
  exact_case_counts: deferred_to_held_out_corpus_freeze

fixture:
  helper_id: EXP-016-NATIVE-HELPER@1
  language: C11
  source: fixture/native_helper.c
  binary: fixture/native-helper
  provenance: fixture/build_provenance.json
  prohibited:
    - Python_script
    - shell_script
    - shebang_wrapper
    - interpreted_executable
    - arbitrary_system_command
  behaviors:
    - argv_length_framing
    - selected_environment_framing
    - cwd_framing
    - bounded_stdout
    - bounded_stderr
    - bounded_both_streams
    - explicit_exit_code
    - bounded_sleep
    - ignore_TERM_bounded_sleep
    - safe_self_signal
    - basename_marker
    - basename_marker_then_exit
    - basename_marker_then_sleep
  safety:
    no_shell: true
    no_arbitrary_exec: true
    no_network: true
    no_privilege_operations: true
    no_descendants: true
    no_writes_outside_cwd_basename: true
    max_stream_bytes_per_requested_stream: 131072
    max_sleep_ms: 1800

reachability_gate:
  contract: contracts/reachability_gate.json
  implementation: safetybox.experiments.exp016_reachability
  production_validator_import: PROHIBITED
  process_adapter_use: PROHIBITED
  future_expected_valid_state: VALID_NATIVE_EXECUTABLE
  runs_before_corpus_freeze: true
  blocks_freeze_on_mismatch: true

cwd_reachability:
  states: [VALID_DIRECTORY, MISSING, SYMLINK, NON_DIRECTORY]
  structural_rule: >-
    Every intended cwd-validation case must independently satisfy compound ALLOW
    and executable validity so cwd validation is not masked.

failure_seams:
  source_of_truth: contracts/scoring_contract.json
  supported:
