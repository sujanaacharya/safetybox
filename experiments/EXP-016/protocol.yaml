    - SPAWN_FAILURE_CONFIRMED_NO_CHILD
    - CAPTURE_FAILURE_AFTER_CHILD
    - POST_COMPLETION_AUDIT_SUCCESS
    - POST_COMPLETION_AUDIT_FAILURE
  unsupported:
    POST_SPAWN_AUDIT: >-
      no production audit event exists between synchronous child creation and
      child completion; use in the held-out corpus is prohibited
  multiple_injections_per_case: prohibited

route_reachability:
