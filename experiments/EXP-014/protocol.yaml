experiment_id: EXP-014
title: Real Filesystem Mediation and Complete-Path Evaluation
version: 1
status: PREREGISTERED
results_included: false
implementation_included: false
corpus_included: false
preregistration_date: 2026-09-24
preregistration_base_git_sha: f4713f2f7012ba933ad9059fe8778004e331ae11
protocol_freeze_git_sha: TO_BE_RECORDED_BY_FREEZE_COMMIT
safetybox_version: 0.0.0

research_question: >-
  Can SafetyBox deterministically mediate real filesystem operations so that authorized
  operations execute, unauthorized operations produce no protected side effect, execution
  ordering remains authorize-before-effect, and canonical audit evidence faithfully
  reconstructs attempted and completed behavior?
research_question_mapping:
  - RQ-01
  - RQ-04
  - RQ-10
secondary_questions:
  - Can resource canonicalization prevent path aliases from bypassing policy?
  - Can denied actions be shown to have produced zero filesystem mutation?
  - Can denied read, list, and stat requests be shown to disclose no bytes, names, or metadata?
  - What happens under symlinks, traversal, race-sensitive paths, and adapter failures?
  - Can every attempted operation be reconstructed from audit evidence?
  - What measurable overhead does adapter mediation add?
  - Where does in-process mediation remain bypassable?

