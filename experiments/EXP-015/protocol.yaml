title: Real Subprocess Mediation and Command Execution Control
version: 1
status: PREREGISTERED
evidence_level: LEVEL_0_DESIGN_ONLY
results_included: false
implementation_included: false
corpus_included: false
helper_included: false
preregistration_date: 2026-09-24
preregistration_base_git_sha: d1053c26cdfad781894f57ecedefb07a39d84ca7
protocol_freeze_git_sha: TO_BE_RECORDED_BY_FREEZE_COMMIT
safetybox_version: 0.0.0

frozen_starting_state:
  clean_worktree_verified: true
  current_head: d1053c26cdfad781894f57ecedefb07a39d84ca7
  current_rtm_status: RTM-1
  exp_014:
    protocol_git_sha: 7baf20293caa83d3fff6a200174c4f8840918607
