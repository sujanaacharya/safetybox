id_allocation:
  experiment_search_range_found: EXP-001_THROUGH_EXP-014
  allocated_experiment: EXP-015
  requirement_range: REQ-033_THROUGH_REQ-062
  invariant_range: INV-020_THROUGH_INV-023
  adr: ADR-007
  candidate_claim: CL-011

research_question: >-
  Can SafetyBox mediate real subprocess execution so that authorized commands execute,
  denied commands create no child process or side effect, argument boundaries are
  preserved without shell reinterpretation, execution ordering is authorize-before-spawn,
  and audit evidence truthfully reconstructs process attempts and outcomes?
research_question_mapping:
  - RQ-01
  - RQ-04
  - RQ-10
hypotheses: []
secondary_questions:
  - Can command and argument canonicalization avoid shell-token confusion?
  - Can environment-variable scope be controlled without secret inheritance?
  - Can cwd be represented and scoped safely?
  - Can executable paths be canonicalized without ambient PATH ambiguity?
  - Can denied requests be shown to create zero child process?
  - Can timeout, exit, signal, spawn, audit, and partial-effect failures be classified truthfully?
  - What are the bypass limits of an in-process subprocess adapter?
  - What changes when shell=True or explicit shell syntax enters the model?

mediation_scope:
  target_level: PMED-L1
  current_level: PMED-L0
  guarantee: adapter-routed direct-child subprocess execution only
  levels:
    PMED-L0: simulated process tool
    PMED-L1: adapter-routed real subprocess execution
    PMED-L2: tested framework or process-API interception coverage
    PMED-L3: process-level route enforcement with tested bypass resistance
    PMED-L4: OS, container, or sandbox enforcement
  in_scope:
    - one direct native executable
    - shell-false-equivalent ordered argv
    - canonical logical cwd
    - fixed minimal child environment
    - bounded stdout and stderr capture
    - bounded direct-child timeout and termination
    - Linux exit and signal outcome
    - adapter lifecycle audit
  excluded:
    - shell_true
    - command_strings
    - explicit_shell_c
    - pipes_and_redirection
    - command_substitution_and_subshells
    - globbing_and_variable_expansion
    - shell_operators_and_builtins
    - background_processes_and_daemonization
    - process_groups_and_descendant_control
    - interactive_tty_or_pty
    - caller_stdin
    - caller_environment
    - inherited_descriptors
    - concurrency_and_toctou_resistance
    - real_agent_integration
    - production_readiness
    - privilege_escalation
    - dangerous_resource_exhaustion
  forbidden_claims:
    - complete_process_mediation
    - universal_process_confinement
    - descendant_confinement
    - shell_mediation
    - safe_authorized_child_behavior
    - automatic_rtm_2_promotion

real_tool_maturity:
  current: RTM-1
  possible_future_contribution: RTM-2
  automatic_promotion_preregistered: false

execution_model:
  action: process.exec
  mode: DIRECT_EXECUTABLE_ARGV
  shell_equivalent: false
  request_fields:
    - request_id
    - session_id
    - task_id
    - actor
    - executable
    - argv
    - cwd
    - timeout_ms
  executable_in_argv: false
  stdin: CLOSED_EMPTY
  environment: FIXED_MINIMAL_NON_INHERITED
  direct_child_only: true

shell_boundary:
  direct_invocation:
    representation: absolute executable plus ordered argv tuple
    parsing: no shell parsing or reconstruction
  shell_interpretation:
    representation: command language string
    status: EXCLUDED_REQUIRES_SEPARATE_EXPERIMENT
    future_coverage:
      - tokenization
      - pipes
      - redirections
      - command_substitution
      - subshells
      - globbing
      - variable_expansion
      - operators
      - builtins
      - background_jobs
  rationale: >-
    Shell interpretation can select multiple commands and effects and therefore cannot be
    inferred from direct executable and argv mediation.

trusted_base:
  trusted:
    - SafetyBox authorizer
    - future subprocess adapter
    - executable canonicalizer and validator
    - cwd canonicalizer and mapper
    - narrow process primitive
    - canonical audit recorder
    - deterministic test harness
  untrusted:
    - executable request string
    - argv values
    - cwd request
    - timeout request
    - agent command description
    - subprocess stdout and stderr
    - child behavior
  authority_rule: command text and subprocess output are data, never authority

request_limits:
  argv_max_count: 64
  argv_element_max_utf8_bytes: 4096
  argv_total_max_utf8_bytes: 16384
  nul_allowed: false
  timeout_ms_min: 50
  timeout_ms_max: 2000
  stdout_return_max_bytes: 65536
  stderr_return_max_bytes: 65536

executable_canonicalization:
  input_type: Unicode string
  required_form: absolute POSIX path
  lexical_rules:
    duplicate_separators: collapse
    dot_segments: remove
    dot_dot_segments: resolve lexically while preserving absolute result
    nul: reject
    empty: reject
    relative_or_bare: reject
  authorization_resource: canonical absolute executable path
  frozen_contract_scope: exact process.exec resource only; no executable subtree or raw prefix
  path_lookup:
    ambient_path_search: false
    which_lookup: false
    current_directory_search: false
  post_allow_validation:
    component_symlinks: reject
    terminal_symlink: reject
    missing: reject
    directory: reject
    non_regular: reject
    non_executable_for_test_user: reject
    shebang_or_wrapper_script: reject
    accepted: controlled native executable
  primitive_binding: canonical authorized executable equals primitive executable argument
  pre_authorization_information_boundary:
    mode: pure lexical processing only
    prohibited_target_dependent_calls:
      - stat
      - lstat
      - exists
      - filesystem_resolving_realpath_or_resolve
      - readlink
      - access
      - which
      - PATH_search
      - open
  toctou_status: NOT_SOLVED
  cases:
    absolute_native: ELIGIBLE_AFTER_ALLOW_AND_VALIDATION
    relative: FAIL_CLOSED_NOT_SPAWNED
    bare_name: FAIL_CLOSED_NOT_SPAWNED
    path_search: PROHIBITED
    symlinked: VALIDATION_REJECT_NOT_SPAWNED
    missing: VALIDATION_REJECT_NOT_SPAWNED
    non_executable: VALIDATION_REJECT_NOT_SPAWNED
    directory: VALIDATION_REJECT_NOT_SPAWNED
    wrapper_or_shebang: VALIDATION_REJECT_NOT_SPAWNED

argv_semantics:
  representation: ordered immutable tuple
  element_preservation: exact
  forbidden_transforms:
    - concatenation_into_command_string
    - shell_quoting
    - token_splitting
    - interpolation
    - expansion
    - globbing
  registered_literal_classes:
    - empty_argument
    - spaces
    - single_and_double_quotes
    - semicolon
    - ampersand_ampersand
    - pipe
    - greater_than
    - dollar_parentheses
    - backticks
    - wildcards
  authorization_basis: executable identity and tuple commitments, not pretty-printed command
  authority_role: operation data only; argv text does not grant or deny authority
  dangerous_looking_literal: remains one literal argument and is not an automatic denial
  experiment_claim: boundary preservation, not malicious shell-injection detection
  limitation: executable-specific flag or code semantics are not authorized

environment_policy:
  agent_controlled_authority_dimension: false
  caller_environment_allowed: false
  parent_environment_inherited: false
  exact_child_environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  path_present: false
  secret_like_parent_variables_present: false
  future_resource_classes_not_allocated:
    - ENV_SECRET
    - ENV_RUNTIME
    - ENV_PATH
  future_arbitrary_values: may require a reviewed capability/resource model

cwd_policy:
  required: true
  representation: canonical SafetyBox logical filesystem resource
  logical_root: /workspace
  canonicalization_dependency: EXP-014 lexical cwd semantics
  mapping: fresh temporary host root
  authorization_action: process.cwd
  validation_timing: after complete compound allow
  pre_authorization_host_probe: prohibited
  scope_matching: component-aware; no raw prefix or alternate-representation widening
  rejects:
    - relative_cwd
    - host_cwd
    - outside_logical_workspace
    - missing_cwd
    - non_directory_cwd
    - symlinked_cwd_or_ancestor

authorization_model:
  reused:
    - TaskContract
    - Capability
    - TaskContractPolicy
    - ReferenceMonitor
  independent_process_allowlist: prohibited
  authoritative_system_count: 1
  compound: true
  subdecisions:
    - order: 1
      action: process.exec
      resource: canonical absolute executable
    - order: 2
      action: process.cwd
      resource: canonical logical cwd
  evaluate_both_when_one_denies: true
  combinations:
    ALLOW_ALLOW: may proceed to validation
    ALLOW_DENY: no validation and no spawn
    DENY_ALLOW: no validation and no spawn
    DENY_DENY: no validation and no spawn
  existing_compound_authorizer_gap: >-
    The current generic CompoundAuthorizer composes multiple resources under one
    unchanged action; it cannot yet compose process.exec and process.cwd.
  required_generic_extension_before_adapter: >-
    Extend the shared authorization layer to compose ordered ordinary ActionRequest
    components with distinct actions, delegate every component to TaskContractPolicy,
    preserve every subdecision, and avoid denial short-circuiting.
  process_specific_permission_logic: prohibited
  any_deny_or_exception: no validation and no spawn
  task_binding:
    contract_task_id_match: required
    session_id_preserved_across_components_and_audit: true
    trusted_contract_to_session_binding_required_before_implementation_freeze: true
    current_m2_authenticated_session_binding: absent schema/deployment gap
  unauthorized_dimensions:
    - argv meaning
    - child filesystem effects
    - child network effects
    - descendants

authorization_behavior_boundary:
  hard_authorization_question: Does explicit authority exist?
  behavior_analysis_question: Does observed behavior appear suspicious?
  authorization_inputs:
    - trusted TaskContract
    - canonical action
    - canonical resource
    - explicit Capability
    - deterministic policy rule
  cannot_silently_become_authority_or_deny:
    - B4 finding
    - context inconsistency
    - trajectory finding
    - risk or anomaly score
    - AI output
  future_behavior_intervention: separately governed and audited attenuation or containment decision
  ai_boundary:
    may_propose:
      - capabilities
      - task scopes
      - executable roles
      - cwd roles
    may_not:
      - grant capability
      - expand TaskContract
      - override DENY
      - silently become trusted authority
      - convert anomaly score into hard authorization
    principle: AI_FOR_UNDERSTANDING_DETERMINISM_FOR_AUTHORITY
  future_approval:
    status: NOT_PART_OF_EXP_015
    REQUIRE_APPROVAL: trusted external actor may later issue new versioned authority
    DENY: current authority is absent
    self_approval_by_agent_or_ai: prohibited
  attenuation:
    current_compatibility: strict-subset action/resource capability set in a new contract
    delegation_implemented: false
    schema_gaps:
      - authenticated_parent_child_binding
      - actor_and_session_binding
      - issuer_and_derivation_provenance
      - constraint_subset_proof
      - revocation_and_expiry
      - confused_deputy_protection

ordering:
  allowed_sequence:
    - ADAPTER_REQUEST_RECEIVED
    - COMMAND_CANONICALIZATION_STARTED
    - COMMAND_CANONICALIZATION_SUCCEEDED
    - ACTION_REQUESTED
    - EXECUTABLE_AUTHORIZATION_STARTED
    - EXECUTABLE_AUTHORIZATION_ALLOWED
    - CWD_AUTHORIZATION_STARTED
    - CWD_AUTHORIZATION_ALLOWED
    - EXECUTABLE_VALIDATION_STARTED
    - EXECUTABLE_VALIDATION_SUCCEEDED
    - CWD_VALIDATION_STARTED
    - CWD_VALIDATION_SUCCEEDED
    - EXECUTION_START_COMMITTED_TO_REQUIRED_AUDIT
    - PROCESS_SPAWN_PRIMITIVE_INVOKED
    - DIRECT_CHILD_CREATED
    - PROCESS_TERMINAL_OBSERVED
    - TERMINAL_AUDIT_COMMITTED
  denied_sequence:
    - ADAPTER_REQUEST_RECEIVED
    - COMMAND_CANONICALIZATION_SUCCEEDED
    - ACTION_REQUESTED
    - EXECUTABLE_AUTHORIZATION_DECISION
    - CWD_AUTHORIZATION_DECISION
    - POLICY_DENY_NOT_SPAWNED
  critical_relation: BOTH_ALLOW_BEFORE_VALIDATION_BEFORE_PREAUDIT_COMMIT_BEFORE_SPAWN
  ordering_authority: session-local canonical sequence numbers
  timestamp_authority: false

proposed_invariants:
  INV-020: denied adapter-routed process requests do not invoke the spawn primitive
  INV-021: complete authorization and required pre-spawn audit precede spawn
  INV-022: shell-false argv elements reach the direct child exactly as declared
  INV-023: pre-spawn audit failure prevents spawn and post-spawn failure remains truthful
  status: DESIRED

process_primitive:
  future_concept: ProcessPrimitive
  implementation_included: false
  centralizes:
    - Popen-equivalent spawn
    - posix_spawn-equivalent route if used
    - direct-child wait
    - direct-child timeout termination
  scattered_process_calls: prohibited
  required_observations:
    - invocation_count
    - invocation_order
    - executable_and_argv_snapshot
    - cwd_and_environment_snapshot
    - child_created_state
    - ephemeral_pid_if_created
    - wait_and_termination_outcome
  supports_failure_injection: true

side_effect_definition:
  immediate:
    - spawn_primitive_invoked
    - direct_child_created
    - executable_invoked
    - stdout_or_stderr_emitted
    - exit_or_signal_outcome_produced
  downstream:
    - child_filesystem_change
    - child_network_activity
    - child_descendant_creation
  denied_core_measurement: zero primitive invocation and zero adapter-created direct child
  downstream_observation: selected controlled marker fixtures only

terminal_taxonomy:
  POLICY_DENY_NOT_SPAWNED:
    outcome_family: DENY
    primitive_invoked: false
    child_created: false
    effect_state: NOT_STARTED
  FAIL_CLOSED_NOT_SPAWNED:
    outcome_family: FAIL_CLOSED
    primitive_invoked: false
    child_created: false
    effect_state: NOT_STARTED
  VALIDATION_REJECT_NOT_SPAWNED:
    outcome_family: TOOL_ERROR
    primitive_invoked: false
    child_created: false
    effect_state: NOT_STARTED
  SPAWN_ERROR_NOT_CREATED:
    outcome_family: TOOL_ERROR
    primitive_invoked: true
    child_created: false
    effect_state: NO_CHILD_CONFIRMED
  PROCESS_EXIT_0:
    outcome_family: ALLOW_SUCCESS
    child_created: true
    effect_state: EFFECT_POSSIBLE_OR_OBSERVED
  PROCESS_EXIT_NONZERO_EFFECT_POSSIBLE:
    outcome_family: TOOL_ERROR
    child_created: true
    effect_state: EFFECT_POSSIBLE_OR_OBSERVED
  PROCESS_TIMEOUT_EFFECT_POSSIBLE:
    outcome_family: TOOL_ERROR
    child_created: true
    effect_state: EFFECT_POSSIBLE_OR_OBSERVED
  PROCESS_SIGNALED_EFFECT_POSSIBLE:
    outcome_family: TOOL_ERROR
    child_created: true
    effect_state: EFFECT_POSSIBLE_OR_OBSERVED
  FAIL_INDETERMINATE_EXECUTION_POSSIBLE:
    outcome_family: FAIL_INDETERMINATE
    child_created: UNKNOWN_OR_TRUE
    effect_state: INDETERMINATE

failure_semantics:
  authorization_exception: FAIL_CLOSED_NOT_SPAWNED
  canonicalization_error: FAIL_CLOSED_NOT_SPAWNED
  invalid_request: FAIL_CLOSED_NOT_SPAWNED
  executable_validation_failure: VALIDATION_REJECT_NOT_SPAWNED
  cwd_validation_failure: VALIDATION_REJECT_NOT_SPAWNED
  required_pre_execution_audit_failure: FAIL_CLOSED_NOT_SPAWNED
  unexpected_before_primitive: FAIL_CLOSED_NOT_SPAWNED
  spawn_failure_confirmed_no_child: SPAWN_ERROR_NOT_CREATED
  spawn_failure_child_state_unknown: FAIL_INDETERMINATE_EXECUTION_POSSIBLE
  child_exit_zero: PROCESS_EXIT_0
  child_exit_nonzero: PROCESS_EXIT_NONZERO_EFFECT_POSSIBLE
  timeout: PROCESS_TIMEOUT_EFFECT_POSSIBLE
  signal_termination: PROCESS_SIGNALED_EFFECT_POSSIBLE
  capture_failure_after_spawn: FAIL_INDETERMINATE_EXECUTION_POSSIBLE
  post_spawn_audit_failure: FAIL_INDETERMINATE_EXECUTION_POSSIBLE
  post_completion_audit_failure: FAIL_INDETERMINATE_EXECUTION_POSSIBLE
  rollback_claim: prohibited

timeout_semantics:
  starts: after confirmed direct-child creation
  request_range_ms: [50, 2000]
  initial_signal: SIGTERM
  grace_ms: 250
  escalation_signal: SIGKILL
  reap_direct_child_when_possible: true
  descendant_termination_claim: none
  rollback_claim: none

signal_semantics:
  platform: Linux
  record_signal_number: true
  self_signal_helper_permitted: true
  cross_platform_equivalence_claim: none

output_semantics:
  stdout_mode: bytes
  stderr_mode: bytes
  caller_return:
    max_retained_bytes_per_stream: 65536
    total_byte_count: true
    complete_stream_sha256_when_available: true
    truncation_flag: true
  canonical_audit:
    raw_output: false
    byte_count: true
    sha256_when_available: true
    truncation: true
    capture_status: true
  denied_output: none because no child exists

stdin_semantics:
  caller_input: excluded
  child_stdin: closed or empty
  interactive_tty: excluded
  pipes_between_commands: excluded
  inherited_descriptors: excluded

audit_model:
