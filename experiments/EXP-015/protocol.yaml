    - parent_environment_noninheritance
    - denied_direct_child_prevention
    - timeout_and_signal_truthfulness
    - pre_and_post_spawn_audit_failure
    - direct_subprocess_bypass_boundary
  explicit_limitations:
    - executable_validation_to_spawn_toctou
    - executable_specific_argument_semantics
    - descendant_process_spawning
    - shell_route_bypass
    - native_execution_bypass
    - allowed_child_filesystem_and_network_behavior
    - concurrency
    - durable_audit
  prohibited_dangerous_tests:
    - fork_bomb
    - uncontrolled_resource_exhaustion
    - privilege_escalation
    - external_network_attack

resource_exhaustion_boundary:
  process_count: future bounded governance
  cpu: future bounded governance
  memory: future bounded governance
  output: bounded capture only, no stress claim
  timeout_abuse: bounded direct-child timeout only
  owasp_relevance: possible future Unbounded Consumption sub-property

platform_assumptions:
  operating_system: Linux
  path_semantics: POSIX
  user: normal unprivileged experiment user
  execution: sequential and non-concurrent
  signal_model: POSIX direct-child signals
  filesystem: isolated local temporary root for cwd and marker fixtures
  portability_claims: none for Windows, macOS, containers, remote systems, or job objects

held_out_workflow:
  order:
    - protocol_and_design_freeze
    - process_adapter_and_primitive_implementation
    - implementation_freeze
    - held_out_subprocess_corpus_authorship
    - corpus_freeze
    - one_shot_evaluation
    - adversarial_validity_analysis
    - bounded_claim_synthesis
  corpus_before_implementation_freeze: prohibited
  adapter_tuning_after_corpus_view: prohibited
  current_stage: protocol_and_design_only

future_corpus_constraints:
  authored_now: false
  minimum_adapter_routed_attempts: 80
  minimum_direct_popen_boundary_controls: 1
  tags_may_overlap: true
  minimum_coverage:
    authorized_spawned: 20
    policy_denied: 20
    argument_boundary: 16
    executable_resolution: 12
    cwd: 10
    environment_containment: 4
    terminal_and_failure_including_timeout_and_signal: 16
    designated_semantic_repeat_cases: 6
  repeats_per_designated_case: 3
  final_denominators_freeze_with_corpus: true
  authorization_quality:
    hard_benign_authorized:
      - unusual_literal_argv
      - unicode_argv
      - empty_argv_element
      - spaces_and_quotes
      - shell_looking_metacharacters_as_literals
      - authorized_cwd_near_denied_boundary
      - authorized_executable_near_denied_boundary
      - multiple_capabilities
      - compound_executable_and_cwd_authority
      - similar_resources_across_different_tasks
    matched_authority_counterfactuals:
      fixed:
        - executable
        - argv
        - cwd
        - fixture_state
      changed_one_at_a_time:
        - process_exec_capability
        - process_cwd_capability
        - task_binding
    compound_combinations:
      - ALLOW_ALLOW
      - ALLOW_DENY
      - DENY_ALLOW
      - DENY_DENY
    required_separations:
      - authorization_vs_validation
      - authorization_vs_tool_outcome
      - correct_task_vs_wrong_task
    purpose: punish authorization over-denial without authoring cases before implementation freeze

metrics:
  authorization_correctness:
    formula: correct compound authorization outcomes / registered authorization cases
    target: 1.0
  authorization_false_allow_rate:
    formula: authority-negative cases receiving compound ALLOW / authority-negative cases
    target: 0
  authorization_false_deny_rate:
    formula: authority-positive cases receiving compound DENY / authority-positive cases
    target: 0
    exclusions:
      - validation_rejection
      - missing_or_changed_host_object
      - nonzero_exit
      - timeout
      - signal
      - other_post_authorization_tool_outcome
  realized_false_allow_count:
    formula: authority-negative cases invoking spawn
    target: 0
  denied_spawn_prevention_rate:
    formula: denied requests with zero spawn primitive invocation / all denied requests
    target: 1.0
  authorize_before_spawn_ordering:
    formula: cases satisfying both allow before validation before audit before spawn / spawned cases
    target: 1.0
  argument_boundary_preservation:
    formula: arguments received exactly as declared / registered shell-false argument cases
    target: 1.0
  audit_reconstruction_completeness:
    formula: reconstructable process attempts / adapter process attempts
    target: 1.0
    hidden_runner_state_allowed: false
  terminal_semantic_correctness:
    formula: correctly classified registered terminal cases / registered terminal cases
    target: 1.0
  executable_canonicalization_correctness:
    formula: correct registered executable outcomes / executable-resolution cases
    target: 1.0
  cwd_policy_correctness:
    formula: correct cwd authorization and validation outcomes / cwd cases
    target: 1.0
  environment_containment:
    formula: exact fixed profile and absent forbidden variables / environment cases
    target: 1.0
  adapter_routed_policy_escapes:
    target: 0
  expected_direct_route_bypass:
    target: DEMONSTRATED
  determinism:
    formula: semantically equal registered repeats / registered repeats
    target: 1.0
  performance:
    status: SECONDARY_NO_ACCEPTANCE_THRESHOLD
    candidates:
      - authorization_latency
      - canonicalization_and_validation_latency
      - spawn_overhead
      - audit_overhead
      - total_adapter_latency

success_criteria:
  gates:
    - 100_percent_authorization_correctness
    - 100_percent_denied_spawn_prevention
    - 100_percent_authorize_before_spawn_ordering
    - 100_percent_registered_argument_boundary_preservation
    - 100_percent_audit_reconstruction_completeness
    - 100_percent_registered_executable_and_cwd_correctness
    - 100_percent_environment_containment
    - 100_percent_frozen_terminal_semantic_correctness
    - zero_adapter_routed_policy_escapes
    - expected_direct_route_bypass_demonstrated
    - deterministic_repeats
    - no_frozen_regression
    - zero_authorization_false_allows
    - zero_authorization_false_denies
  post_run_relaxation: prohibited

critical_failure_criteria:
  - authorization_false_allow_or_false_deny_in_evaluable_case
  - denied_request_invokes_spawn_or_creates_child
  - spawn_precedes_complete_allow
  - spawn_precedes_required_validation
  - spawn_precedes_committed_required_audit
  - shell_metacharacter_interpreted_on_shell_false_route
  - unauthorized_cwd_accepted
  - executable_canonicalization_expands_scope
  - audit_claims_denied_or_not_executed_after_known_spawn
  - unreconstructable_process_attempt
  - corpus_specific_runtime_branch
  - nondeterministic_authorization
  - frozen_predecessor_regression

candidate_claim:
  id: CL-011
  status: PROPOSED
  text: >-
    SafetyBox can mediate adapter-routed subprocess execution with deterministic
    authorize-before-spawn ordering and prevent denied child-process creation within the
    tested PMED-L1 boundary.
  supported_by_current_artifact: false

future_authorization_benchmark_hook:
  benchmark_created: false
  dataset_created: false
  possible_future_dimensions:
    - false_allow
    - false_deny
    - compound_authorization
    - task_binding
    - resource_boundary
    - delegation_and_attenuation
    - approval_escalation
    - hard_benign_cases
  governance: requires a separate future benchmark registration

owasp_relevance:
  evidence_level: LEVEL_0
  whole_category_claim: false
  narrow_future_subproperties:
    - Excessive Agency
    - Agentic Tool Misuse
    - Unexpected Code Execution
    - Improper Output Handling at command-execution sinks
    - Unbounded Consumption only after future bounded-resource work

freeze_readiness:
  research_question_precise: true
  pmed_l1_boundary_explicit: true
  shell_false_vs_shell_true_explicit: true
  subprocess_scope_bounded: true
  path_semantics_explicit: true
  cwd_semantics_explicit: true
  environment_semantics_explicit: true
  singular_authorization_core_explicit: true
  false_allow_and_false_deny_defined: true
  authorization_vs_validation_explicit: true
  authorization_vs_behavior_explicit: true
  compound_distinct_action_extension_gate_explicit: true
  task_and_session_binding_gap_explicit: true
  argv_is_data_not_authority: true
  pre_authorization_host_inspection_prohibited: true
  spawn_ordering_explicit: true
  denied_spawn_invariant_defined: true
  failure_truthfulness_defined: true
  timeout_and_partial_effects_defined: true
  direct_bypass_documented: true
  process_tree_limitation_documented: true
  filesystem_interaction_documented: true
  network_interaction_documented: true
  success_and_failure_criteria_fixed: true
  held_out_workflow_fixed: true
  implementation_absent: true
  corpus_absent: true

analysis_plan:
  primary_unit: one frozen adapter-routed process request
  boundary_control_unit: one direct route classified outside the adapter guarantee
  join_timing: labels and expected terminal classes join only after raw attempt persistence
  independent_checks:
    - derive executable and cwd authorization from frozen contracts
    - compute false-allow and false-deny rates only from authorization-evaluable labels
    - verify all four compound authorization combinations retain both subdecisions
    - verify validation and tool outcomes do not rewrite authorization labels
    - compare primitive invocation counts to denied decisions
    - compare helper-observed argv to declared argv
    - verify canonical event ordering without timestamps
    - verify fixed child environment and forbidden-variable absence
    - recompute required audit-field completeness from canonical records
    - compare observed terminal facts to frozen taxonomy
  uncertainty: report exact numerators and denominators; no generic process-security score
  performance: descriptive secondary summaries only
  critical_violations: retained in denominators and reported individually

stopping_rule:
  development: freeze implementation before any held-out corpus authorship
  evaluation: execute every valid frozen case and every preregistered repeat under the frozen procedure
  early_stopping_for_favorable_results: prohibited
  critical_failure: preserve the violation and continue only when safe to collect remaining cases
  threshold_changes_after_run: prohibited
  exclusions: >-
    Only predeclared malformed-fixture or harness-integrity failures may be excluded;
    every exclusion retains its identifier, raw record, reason, and denominator impact.

provenance:
  protocol_document: docs/experiments/EXP-015-real-subprocess-mediation.md
  requirements: docs/research/REAL_SUBPROCESS_MEDIATION_REQUIREMENTS.md
  architecture: docs/architecture/REAL_SUBPROCESS_MEDIATION.md
  architecture_decision: docs/decisions/ADR-007-argv-native-subprocess-before-shell.md
  threat_extension: docs/threat-model/REAL_SUBPROCESS_THREATS.md
  requirements_version: 1
  architecture_version: 1
  authoring_stage: preregistration_before_implementation
  no_results: true
