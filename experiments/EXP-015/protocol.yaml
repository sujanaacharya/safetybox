    - executable_and_cwd_authorization_rule_decision_and_reason
    - authority_source_TaskContract_reference_version_or_hash
    - compound_component_identity
    - executable_and_cwd_validation_outcomes
    - spawn_attempted
    - primitive_invoked
    - child_created_state
    - stable_child_identity_token
    - optional_ephemeral_pid
    - exit_status
    - signal
